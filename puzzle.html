<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Memory Puzzle ❤️</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="stars"></div>
<div id="hearts"></div>
<div id="flowers"></div>

<section class="gameContainer">

<h1>🧩 Memory Puzzle ❤️</h1>

<p>

Har memory tabhi complete hoti hai...
Jab hum dono saath hote hain. ❤️

</p>

<div id="puzzle">

<img src="images/p1.jpg" class="piece">
<img src="images/p2.jpg" class="piece">
<img src="images/p3.jpg" class="piece">

<img src="images/p4.jpg" class="piece">
<img src="images/p5.jpg" class="piece">
<img src="images/p6.jpg" class="piece">

<img src="images/p7.jpg" class="piece">
<img src="images/p8.jpg" class="piece">
<img src="images/p9.jpg" class="piece">

</div>

<button id="shuffle">

🔀 Shuffle Puzzle

</button>

<button

id="nextBtn"

style="display:none"

onclick="location.href='letter.html'">

💌 Unlock Secret Letter

</button>

</section>

<script>

const puzzle=document.getElementById("puzzle");

const pieces=[...document.querySelectorAll(".piece")];

const shuffle=document.getElementById("shuffle");

const next=document.getElementById("nextBtn");

shuffle.onclick=()=>{

pieces.sort(()=>Math.random()-0.5);

pieces.forEach(piece=>puzzle.appendChild(piece));

setTimeout(()=>{

alert("❤️ Puzzle Complete ❤️");

next.style.display="inline-block";

},5000);

};

</script>

<script src="js/main.js"></script>

</body>

</html>
