<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Birthday Memory Puzzle ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<audio id="birthdaySong" preload="auto" loop><source src="music/happy-birthday-to-you.mp3" type="audio/mpeg"></audio><button id="musicFallback" class="music-fallback" onclick="startBirthdayMusic()">🎵 Play Birthday Song</button><body><div id="fallingFlowers" class="falling-flowers" aria-hidden="true"></div>

<div class="hearts">
    <span>❤️</span><span>💖</span><span>💕</span><span>💗</span><span>💞</span>
</div>

<section class="puzzle-section">
    <p class="mini-title">🎂 Birthday Memory Challenge</p>
    <h1>🧩 Complete Our Memory ❤️</h1>
    <p>Photo ke tukdo ko sahi jagah laga kar memory complete karo.</p>

    <div id="puzzle"></div>
    <h2 id="message"></h2>

    <button onclick="shufflePuzzle()">🔄 Shuffle Again</button>

    <div class="page-buttons">
        <a href="gallery.html"><button>📸 Memories</button></a>
        <a href="proposal.html"><button>💌 Final Surprise</button></a>
    </div>
</section>

<script src="puzzle.js"></script>
<script>
function createFallingFlowers(){
 const box=document.getElementById("fallingFlowers"); if(!box)return;
 const flowers=["🌸","🌺","🌷","💮","🏵️","🌼"];
 for(let i=0;i<26;i++){
  const f=document.createElement("span"); f.className="falling-flower";
  f.textContent=flowers[Math.floor(Math.random()*flowers.length)];
  f.style.left=(Math.random()*100)+"vw";
  f.style.fontSize=(12+Math.random()*16)+"px";
  f.style.animationDuration=(6+Math.random()*7)+"s";
  f.style.animationDelay=(-Math.random()*12)+"s";
  f.style.setProperty("--drift",(-50+Math.random()*100)+"px");
  box.appendChild(f);
 }
}
document.addEventListener("DOMContentLoaded",createFallingFlowers);
</script></body>
</html>
