<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"></head><body class="puzzle-theme"><div class="floaties" id="floaties"></div><script src="decor.js"></script><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><main class="card"><h1 class="page-title">Photo Game 🧩</h1><div class="frame"><div class="puzzle-board" id="puzzle"></div></div><p id="message" class="msg"></p><div class="nav"><button onclick="shufflePuzzle()">Shuffle 🔀</button><a href="proposal.html"><button>Next ✨</button></a></div></main></div><script src="puzzle.js"></script><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body></html>
