<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"></head><body class="balloon-theme"><div class="floaties" id="floaties"></div><script src="decor.js"></script><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><main class="card"><h1 class="page-title">Balloon Pop 🎈</h1><p class="balloon-hint" id="hint">Ek balloon choose karo aur pop karo ❤️</p><div class="frame romantic-frame"><div class="balloon-field" id="field"></div></div><div class="balloon-msg" id="msgBox"><span id="msgText"></span></div><div class="nav" id="finishNav" style="display:none"><a href="special.html"><button type="button">Continue ❤️</button></a><button type="button" onclick="resetGame()">Replay 🔄</button></div></main></div><script src="balloon.js"></script><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body></html>
