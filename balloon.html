<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><body class="balloon-theme"><div class="floaties"><span style="left:4%;font-size:22px;animation-duration:14s;animation-delay:-2s">🌸</span><span style="left:15%;font-size:16px;animation-duration:19s;animation-delay:-9s">❤️</span><span style="left:27%;font-size:26px;animation-duration:12s;animation-delay:-5s">🌺</span><span style="left:40%;font-size:18px;animation-duration:21s;animation-delay:-14s">💕</span><span style="left:53%;font-size:24px;animation-duration:16s;animation-delay:-3s">🌷</span><span style="left:65%;font-size:19px;animation-duration:13s;animation-delay:-8s">💐</span><span style="left:76%;font-size:23px;animation-duration:18s;animation-delay:-11s">❤️</span><span style="left:88%;font-size:17px;animation-duration:15s;animation-delay:-6s">🌸</span><span style="left:33%;font-size:20px;animation-duration:20s;animation-delay:-17s">💕</span><span style="left:95%;font-size:21px;animation-duration:17s;animation-delay:-4s">🌺</span></div><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><main class="card"><h1 class="page-title">Balloon Pop 🎈</h1><p class="balloon-hint" id="hint">Ek balloon choose karo aur pop karo ❤️</p><div class="balloon-field" id="field"></div><div class="balloon-msg" id="msgBox"><span id="msgText"></span></div><div class="nav" id="finishNav" style="display:none"><a href="index.html"><button>Home 🏠</button></a><button onclick="resetGame()">Replay 🔄</button></div></main></div><script src="balloon.js"></script><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body>
