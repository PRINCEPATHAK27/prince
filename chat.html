<!-- chat.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Chat · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .phone{
    width:100%;
    max-width:420px;
    height:70vh;
    max-height:640px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(28,15,43,0.85), rgba(18,8,28,0.95));
    border:1px solid rgba(255,122,148,0.15);
    border-radius:28px;
    box-shadow: 0 20px 60px rgba(255,122,148,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .phone-header{
    padding:1rem 1.4rem;
    display:flex;
    align-items:center;
    gap:0.8rem;
    border-bottom:1px solid rgba(255,122,148,0.12);
    background: rgba(255,122,148,0.05);
  }
  .avatar{
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg, #ff7a94, #f0c079);
    display:flex; align-items:center; justify-content:center;
    font-weight:600; color:#1c0f16;
    box-shadow: 0 0 20px rgba(255,122,148,0.3);
  }
  .phone-header .name{ font-weight:500; color: #f8ecdf; }
  .phone-header .status{ font-size:0.75rem; color: #4ade80; }

  .phone-body{
    flex:1;
    overflow-y:auto;
    padding:1.2rem;
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,122,148,0.03), transparent 70%);
  }
  .bubble{
    max-width:80%;
    padding:0.7rem 1rem;
    border-radius:18px;
    font-size:0.92rem;
    line-height:1.4;
    opacity:0;
    transform:translateY(10px) scale(0.96);
    animation:bubbleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes bubbleIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .bubble.me{
    align-self:flex-end;
    background:linear-gradient(135deg, #ff7a94, #f0c079);
    color:#1c0f16;
    border-bottom-right-radius:4px;
    box-shadow: 0 4px 15px rgba(255,122,148,0.25);
  }
  .bubble.them{
    align-self:flex-start;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
    border-bottom-left-radius:4px;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:0.7rem 1rem;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:18px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:8px; height:8px; border-radius:50%;
    background:var(--cream-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.2; transform:scale(0.8); } 40%{ opacity:1; transform:scale(1); } }

  .replay{ margin-top:1.5rem; }
  #replay-btn { transition: all 0.3s ease; }
  #replay-btn:hover { transform: rotate(-180deg); }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">💬 chapter two</p>
  <h1 class="display-lg serif center gradient-text" style="margin:0 0 2rem;">A Conversation Worth Keeping</h1>

  <div class="phone">
    <div class="phone-header">
      <div class="avatar">💛</div>
      <div>
        <div class="name">Palak</div>
        <div class="status" id="status-line">● online</div>
      </div>
    </div>
    <div class="phone-body" id="chat-body"></div>
  </div>

  <div class="row replay">
    <button class="btn btn-ghost" id="replay-btn">↺ Replay</button>
    <a href="gallery.html" class="btn">Continue →</a>
  </div>
</main>

<script src="js/main.js"></script>
<script>renderJourneyNav('chat.html');</script>
<script>
const script = [
  { sender:"me", text:"hey Palak 👋" },
  { sender:"them", text:"heyy! kaise ho?" },
  { sender:"me", text:"good, thinking about you actually" },
  { sender:"them", text:"awww 🥹 kyun?" },
  { sender:"me", text:"kyunki tumhare bina din adhoora lagta hai" },
  { sender:"them", text:"😳 tum bhi na..." },
  { sender:"me", text:"I made something for you. scroll karte raho, tumhe pasand aayega" },
  { sender:"them", text:"kya banaya hai tumne?? 👀" },
  { sender:"me", text:"bas dekhte raho... 💛" },
];

const body = document.getElementById('chat-body');
const statusLine = document.getElementById('status-line');

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playScript(){
  body.innerHTML = '';
  statusLine.textContent = '● online';
  for(const msg of script){
    if(msg.sender === 'them'){
      statusLine.textContent = '● typing...';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(typing);
      body.scrollTop = body.scrollHeight;
      await sleep(900 + Math.random()*600);
      typing.remove();
      statusLine.textContent = '● online';
    } else {
      await sleep(400);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.sender === 'me' ? 'me' : 'them');
    bubble.textContent = msg.text;
    body.appendChild(bubble);
    body.scrollTop = body.scrollHeight;
    await sleep(500);
  }
}

playScript();
document.getElementById('replay-btn').addEventListener('click', playScript);
</script>
</body>
</html>
