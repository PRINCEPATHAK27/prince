<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Chat · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .phone{
    width:100%;
    max-width:420px;
    height:70vh;
    max-height:640px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .phone-header{
    padding:1rem 1.4rem;
    display:flex;
    align-items:center;
    gap:0.8rem;
    border-bottom:1px solid var(--glass-border);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg, var(--rose), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-weight:600; color:#1c0f16;
  }
  .phone-header .name{ font-weight:500; }
  .phone-header .status{ font-size:0.75rem; color:var(--cream-dim); }

  .phone-body{
    flex:1;
    overflow-y:auto;
    padding:1.2rem;
    display:flex;
    flex-direction:column;
    gap:0.5rem;
  }
  .bubble{
    max-width:75%;
    padding:0.6rem 0.9rem;
    border-radius:16px;
    font-size:0.92rem;
    line-height:1.4;
    opacity:0;
    transform:translateY(10px);
    animation:bubbleIn 0.35s ease forwards;
  }
  @keyframes bubbleIn{ to{ opacity:1; transform:translateY(0); } }
  .bubble.me{
    align-self:flex-end;
    background:linear-gradient(135deg, rgba(255,122,148,0.85), rgba(240,192,121,0.7));
    color:#1c0f16;
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start;
    background:rgba(255,255,255,0.09);
    border:1px solid var(--glass-border);
    border-bottom-left-radius:4px;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:0.6rem 0.9rem;
    background:rgba(255,255,255,0.09);
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--cream-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.2; } 40%{ opacity:1; } }

  .replay{ margin-top:1.5rem; }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">chapter two</p>
  <h1 class="display-lg serif center" style="margin:0 0 2rem;">A Conversation Worth Keeping</h1>

  <div class="glass phone">
    <div class="phone-header">
      <div class="avatar">P</div>
      <div>
        <div class="name">Palak</div>
        <div class="status" id="status-line">online</div>
      </div>
    </div>
    <div class="phone-body" id="chat-body"></div>
  </div>

  <div class="row replay">
    <button class="btn btn-ghost" id="replay-btn">↺ Replay</button>
    <a href="gallery.html" class="btn">Continue →</a>
  </div>
</main>

<script src="js/main.js"></script>
<script>renderJourneyNav('chat.html');</script>
<script>
/* Edit this script to match a real (or imagined) conversation between you two.
   sender: "me" = Prince, "them" = Palak */
const script = [
  { sender:"me", text:"hey Palak 👋" },
  { sender:"them", text:"heyy! kaise ho?" },
  { sender:"me", text:"good, thinking about you actually" },
  { sender:"them", text:"awww 🥹 kyun?" },
  { sender:"me", text:"kyunki tumhare bina din adhoora lagta hai" },
  { sender:"them", text:"😳 tum bhi na..." },
  { sender:"me", text:"I made something for you. scroll karte raho, tumhe pasand aayega" },
  { sender:"them", text:"kya banaya hai tumne?? 👀" },
  { sender:"me", text:"bas dekhte raho... 💛" },
];

const body = document.getElementById('chat-body');
const statusLine = document.getElementById('status-line');

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playScript(){
  body.innerHTML = '';
  statusLine.textContent = 'online';
  for(const msg of script){
    if(msg.sender === 'them'){
      statusLine.textContent = 'typing...';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(typing);
      body.scrollTop = body.scrollHeight;
      await sleep(900 + Math.random()*600);
      typing.remove();
      statusLine.textContent = 'online';
    } else {
      await sleep(500);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.sender === 'me' ? 'me' : 'them');
    bubble.textContent = msg.text;
    body.appendChild(bubble);
    body.scrollTop = body.scrollHeight;
    await sleep(600);
  }
}

playScript();
document.getElementById('replay-btn').addEventListener('click', playScript);
</script>
</body>
</html>
