<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .g-wrap{ max-width:900px; width:100%; }
  .g-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:0.8rem;
    margin:2rem 0 2.5rem;
  }
  @media (max-width:700px){ .g-grid{ grid-template-columns:repeat(3, 1fr); } }
  .g-tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid rgba(255,122,148,0.15);
    transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .g-tile:hover{
    transform:scale(1.06) rotate(1deg);
    box-shadow: 0 8px 40px rgba(255,122,148,0.25);
    border-color: var(--rose);
  }
  .g-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .g-tile .heart-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255,122,148,0.2), rgba(240,192,121,0.15));
    backdrop-filter: blur(2px);
    gap:4px;
    transition: opacity 0.3s ease;
  }
  .g-tile .heart-overlay span{ font-size:2.4rem; }
  .g-tile .heart-overlay small{ font-size:0.55rem; color:var(--cream-dim); }
  .g-tile:nth-child(5n+1){ border-color: rgba(255,122,148,0.3); }
  .g-tile:nth-child(5n+2){ border-color: rgba(240,192,121,0.3); }
  .g-tile:nth-child(5n+3){ border-color: rgba(192,132,252,0.3); }
  .g-tile:nth-child(5n+4){ border-color: rgba(74,222,128,0.3); }
  .g-tile:nth-child(5n+5){ border-color: rgba(251,191,36,0.3); }

  #lightbox{
    position:fixed; inset:0;
    background:rgba(10,5,15,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:1rem;
    z-index:100;
    cursor:zoom-out;
    padding:2rem;
    backdrop-filter:blur(20px);
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width:90vw;
    max-height:75vh;
    border-radius:16px;
    box-shadow: 0 20px 80px rgba(255,122,148,0.2);
    border:2px solid rgba(255,122,148,0.15);
    animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes zoomIn { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
  #lightbox-caption{ color:var(--cream-dim); font-size:0.9rem; }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">📸 chapter three</p>
  <h1 class="display-lg serif center gradient-text" style="margin:0 0 0.4rem;">Every Moment, Kept</h1>
  <p class="lead center" style="max-width:520px;">Add your own 25 photos to the <code style="background:rgba(255,122,148,0.1); padding:0.2rem 0.6rem; border-radius:6px; color:var(--rose);">images/</code> folder — name them photo1.jpg through photo25.jpg — and they'll appear here automatically.</p>

  <div class="g-wrap">
    <div class="g-grid" id="gallery-grid"></div>
  </div>

  <a href="game.html" class="btn">Continue →</a>
</main>

<div id="lightbox">
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-caption"></div>
</div>

<script src="js/main.js"></script>
<script src="js/gallery.js"></script>
<script>renderJourneyNav('gallery.html');</script>
</body>
</html>
