<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .g-wrap{ max-width:900px; width:100%; }
  .g-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:0.8rem;
    margin:2rem 0 2.5rem;
  }
  @media (max-width:700px){ .g-grid{ grid-template-columns:repeat(3, 1fr); } }
  .g-tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid var(--glass-border);
    transition:transform 0.25s ease;
  }
  .g-tile:hover{ transform:scale(1.04); }
  .g-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .g-placeholder{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
    background:linear-gradient(135deg, rgba(255,122,148,0.12), rgba(240,192,121,0.1));
    color:var(--rose-soft);
  }
  .g-placeholder span{ font-size:1.6rem; }
  .g-placeholder small{ font-size:0.55rem; color:var(--cream-dim); }

  #lightbox{
    position:fixed; inset:0;
    background:rgba(10,5,15,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:1rem;
    z-index:100;
    cursor:zoom-out;
    padding:2rem;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:90vw; max-height:75vh; border-radius:14px; }
  #lightbox-caption{ color:var(--cream-dim); font-size:0.9rem; }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">chapter three</p>
  <h1 class="display-lg serif center" style="margin:0 0 0.4rem;">Every Moment, Kept</h1>
  <p class="lead center" style="max-width:520px;">Add your own 25 photos to the <code>images/</code> folder — name them photo1.jpg through photo25.jpg — and they'll appear here automatically.</p>

  <div class="g-wrap">
    <div class="g-grid" id="gallery-grid"></div>
  </div>

  <a href="game.html" class="btn">Continue →</a>
</main>

<div id="lightbox">
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-caption"></div>
</div>

<script src="js/main.js"></script>
<script src="js/gallery.js"></script>
<script>renderJourneyNav('gallery.html');</script>
</body>
</html>
