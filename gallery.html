<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><body class="gallery-theme"><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><main class="card"><h1 class="page-title">Our Memories ❤️</h1><div class="frame"><div class="gallery-grid"><img src="images/photo1.jpg"><img src="images/photo2.jpg"><img src="images/photo3.jpg"><img src="images/photo4.jpg"><img src="images/photo5.jpg"><img src="images/photo6.jpg"><img src="images/photo7.jpg"><img src="images/photo8.jpg"><img src="images/photo9.jpg"><img src="images/photo10.jpg"></div></div><div class="nav"><a href="puzzle.html"><button>Next ✨</button></a></div></main></div><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body>
