<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .lock-wrap{ max-width:420px; width:100%; padding:2.4rem 2rem; text-align:center; }
  #pass-input{
    width:100%;
    padding:0.8rem 1rem;
    border-radius:12px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.05);
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    font-size:1rem;
    text-align:center;
    margin:1rem 0;
  }
  #pass-error{ color:var(--rose); font-size:0.85rem; min-height:1.2em; }
  #letter-content{ display:none; text-align:left; }
  #letter-content p{ color:var(--cream-dim); line-height:1.9; font-size:1.02rem; }
  #letter-content textarea{
    width:100%;
    min-height:260px;
    background:transparent;
    border:1px dashed var(--glass-border);
    border-radius:12px;
    color:var(--cream-dim);
    font-family:'Cormorant Garamond', serif;
    font-size:1.15rem;
    line-height:1.9;
    padding:1rem;
  }
  .hint{ font-size:0.8rem; color:var(--rose-soft); opacity:0.75; }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">chapter six</p>
  <h1 class="display-lg serif center" style="margin:0 0 2rem;">A Letter, Locked Just For You</h1>

  <div class="glass lock-wrap" id="lock-box">
    <p class="display-md serif" style="margin:0 0 0.4rem;">🔒</p>
    <p class="lead">Enter the password only you would know.</p>
    <input type="password" id="pass-input" placeholder="password" autocomplete="off">
    <p id="pass-error"></p>
    <button class="btn" id="unlock-btn">Unlock</button>
    <p class="hint" style="margin-top:1rem;">hint: what I call you sometimes 🍅</p>
  </div>

  <div class="glass lock-wrap" id="letter-content" style="max-width:560px;">
    <p class="eyebrow">to Palak</p>
    <textarea id="letter-text">Palak,

By the time you're reading this, you've already gone through our whole story, our chats, our photos, a silly game and a puzzle — and you're still here. That means something.

I wanted to write you something real, not just pretty words. So here's your space — replace this with whatever you actually want to say to her. Talk about what she means to you, what you're grateful for, what you hope for next.

Whatever you write here, mean every word.

— Prince</textarea>
    <div class="row" style="margin-top:1.4rem; justify-content:flex-end;">
      <a href="night.html" class="btn">Continue →</a>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script>renderJourneyNav('letter.html');</script>
<script>
const PASSWORD = 'tamatar'; // case-insensitive check below
const input = document.getElementById('pass-input');
const btn = document.getElementById('unlock-btn');
const error = document.getElementById('pass-error');
const lockBox = document.getElementById('lock-box');
const letterContent = document.getElementById('letter-content');

function tryUnlock(){
  if(input.value.trim().toLowerCase() === PASSWORD){
    lockBox.style.display = 'none';
    letterContent.style.display = 'block';
    error.textContent = '';
  } else {
    error.textContent = 'Not quite — try again 💭';
  }
}

btn.addEventListener('click', tryUnlock);
input.addEventListener('keypress', (e)=>{ if(e.key === 'Enter') tryUnlock(); });
</script>
</body>
</html>
