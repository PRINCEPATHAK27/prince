<!-- game.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Hearts · Forever With You</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .game-wrap{ max-width:520px; width:100%; }
  #game-area{
    position:relative;
    width:100%;
    height:60vh;
    max-height:520px;
    overflow:hidden;
    border-radius:24px;
    background: radial-gradient(ellipse at 50% 80%, rgba(255,122,148,0.05), transparent 70%);
    border:1px solid rgba(255,122,148,0.1);
  }
  .falling-heart{
    position:absolute;
    top:-40px;
    font-size:2rem;
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
    line-height:1;
    filter:drop-shadow(0 0 12px rgba(255,122,148,0.5));
    animation-name:fall;
    animation-timing-function:linear;
    transition: transform 0.1s ease;
  }
  .falling-heart:hover { transform: scale(1.3); }
  @keyframes fall{
    from{ transform:translateY(-40px); }
    to{ transform:translateY(calc(60vh + 40px)); }
  }
  .hud{
    display:flex;
    justify-content:space-between;
    width:100%;
    padding:0.4rem 0.2rem;
    font-size:0.9rem;
    color:var(--cream-dim);
  }
  .hud strong { color: var(--cream); font-size: 1.2rem; }
  #game-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1rem;
    background:rgba(18,8,28,0.6);
    backdrop-filter:blur(12px);
    text-align:center;
    padding:2rem;
    border-radius:24px;
  }
  #game-overlay .display-md { background: linear-gradient(135deg, #ff7a94, #f0c079); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<canvas id="ambient-canvas"></canvas>

<main class="page">
  <p class="eyebrow center" style="margin-bottom:0.6rem;">🎮 chapter four</p>
  <h1 class="display-lg serif center gradient-text" style="margin:0 0 1rem;">Catch Every Heart</h1>
  <p class="lead center" style="max-width:440px; margin-bottom:1.5rem;">Just like real life — you don't get every one, but you catch enough to know it's worth playing.</p>

  <div class="game-wrap">
    <div class="hud">
      <span>❤️ Score: <strong id="score">0</strong></span>
      <span>⏱ Time: <strong id="time">30</strong>s</span>
    </div>
    <div class="glass" id="game-area">
      <div id="game-overlay">
        <p class="display-md serif" style="margin:0;">Ready?</p>
        <p class="lead" style="margin:0;">Tap the hearts as they fall. 30 seconds.</p>
        <button class="btn pulse-btn" id="start-btn">Start</button>
      </div>
    </div>
  </div>

  <div class="row" style="margin-top:1.5rem;">
    <a href="puzzle.html" class="btn">Continue →</a>
  </div>
</main>

<script src="js/main.js"></script>
<script>renderJourneyNav('game.html');</script>
<script>
const area = document.getElementById('game-area');
const overlay = document.getElementById('game-overlay');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const startBtn = document.getElementById('start-btn');

let score = 0, timeLeft = 30, spawnInterval, timerInterval;

function spawnHeart(){
  const h = document.createElement('button');
  h.className = 'falling-heart';
  const hearts = ['💗', '❤️', '💖', '💝', '💕'];
  h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  h.style.left = Math.random()*85 + '%';
  const duration = 3 + Math.random()*2.5;
  h.style.animationDuration = duration + 's';
  h.addEventListener('animationend', ()=> h.remove());
  h.addEventListener('click', ()=>{
    score += 1;
    scoreEl.textContent = score;
    h.style.transform = 'scale(1.5)';
    setTimeout(() => h.remove(), 100);
    // spawn mini hearts
    for(let i=0; i<5; i++) {
      const spark = document.createElement('span');
      spark.textContent = '💗';
      spark.style.position = 'fixed';
      spark.style.pointerEvents = 'none';
      spark.style.fontSize = '0.6rem';
      spark.style.left = (event.clientX + (Math.random()-0.5)*40) + 'px';
      spark.style.top = (event.clientY + (Math.random()-0.5)*40) + 'px';
      spark.style.zIndex = '100';
      spark.style.animation = 'floatUp 0.8s ease-out forwards';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 900);
    }
  });
  area.appendChild(h);
}

function endGame(){
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  document.querySelectorAll('.falling-heart').forEach(h=>h.remove());
  overlay.style.display = 'flex';
  let message;
  if(score >= 20) message = "Perfect. Just like how you caught my heart. 💗";
  else if(score >= 10) message = "Not bad! You already caught the one that matters most — me.";
  else message = "You may have missed a few hearts, but you never miss mine.";
  overlay.innerHTML = `
    <p class="display-md serif" style="margin:0;">💖 ${score}</p>
    <p class="lead" style="margin:0; max-width:340px;">${message}</p>
    <button class="btn pulse-btn" id="restart-btn">Play again</button>
  `;
  document.getElementById('restart-btn').addEventListener('click', startGame);
}

function startGame(){
  score = 0; timeLeft = 30;
  scoreEl.textContent = 0;
  timeEl.textContent = 30;
  overlay.style.display = 'none';
  spawnInterval = setInterval(spawnHeart, 450);
  timerInterval = setInterval(()=>{
    timeLeft -= 1;
    timeEl.textContent = timeLeft;
    if(timeLeft <= 0) endGame();
  }, 1000);
}

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
