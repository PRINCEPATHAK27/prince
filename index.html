<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"></head><body class="index-theme"><div class="floaties" id="floaties"></div><script src="decor.js"></script><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><div class="card" id="count"><div class="countdown"><div class="time-box"><b id="d">0</b><span>DAYS</span></div><div class="time-box"><b id="h">0</b><span>HOURS</span></div><div class="time-box"><b id="m">0</b><span>MINUTES</span></div><div class="time-box"><b id="s">0</b><span>SECONDS</span></div></div><div class="gift-wrap"><div class="gift-glow"></div><div class="gift-hearts"><span style="top:2%;left:4%;font-size:20px;animation-delay:0s">❤️</span><span style="top:32%;left:-6%;font-size:16px;animation-delay:.6s">💗</span><span style="top:64%;left:0%;font-size:15px;animation-delay:1.1s">💕</span><span style="top:6%;right:2%;font-size:17px;animation-delay:.3s">💗</span><span style="top:36%;right:-8%;font-size:20px;animation-delay:.9s">❤️</span><span style="top:68%;right:-2%;font-size:15px;animation-delay:1.4s">💕</span></div><img src="images/gift.png" class="gift-img" alt="gift"><div class="gift-tag">For You<br>♡</div></div><div class="divider"><span class="line"></span><span>❤️</span><span class="line"></span></div><p class="waiting-text">Ek pyara sa surprise tumhara wait kar raha hai... 💕</p></div><div class="love-card hidden" id="love"><div style="font-size:70px">❤️</div><p class="love-question">Kya tum mujhse pyaar karti ho? ❤️</p><div class="love-buttons" id="btns"><button class="yes" onclick="yes()">YES ❤️</button><button class="no" id="no">NO 😏</button></div><div class="result" id="res"><div style="font-size:60px">💖</div><button onclick="location.href='gallery.html'">Continue ✨</button></div></div></div><script src='script.js'></script><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body></html>
