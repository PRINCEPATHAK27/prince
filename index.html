<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"></head><body class="index-theme"><audio id="bgMusic" loop preload="auto"><source src="music/birthday.mp3" type="audio/mpeg"></audio><div class="page"><div class="card" id="count"><div class="countdown"><div class="time-box"><b id="d">0</b><span>DAYS</span></div><div class="time-box"><b id="h">0</b><span>HOURS</span></div><div class="time-box"><b id="m">0</b><span>MINUTES</span></div><div class="time-box"><b id="s">0</b><span>SECONDS</span></div></div></div><div class="love-card hidden" id="love"><div style="font-size:70px">❤️</div><p class="love-question">Kya tum mujhse pyaar karti ho? ❤️</p><div class="love-buttons" id="btns"><button class="yes" onclick="yes()">YES ❤️</button><button class="no" id="no">NO 😏</button></div><div class="result" id="res"><div style="font-size:60px">💖</div><button onclick="location.href='gallery.html'">Continue ✨</button></div></div></div><script>const t=new Date('September 1, 2026 00:00:00').getTime();function tick(){let x=t-Date.now();if(x<=0){count.classList.add('hidden');love.classList.remove('hidden');return}d.textContent=Math.floor(x/86400000);h.textContent=Math.floor(x/3600000%24);m.textContent=Math.floor(x/60000%60);s.textContent=Math.floor(x/1000%60)}tick();setInterval(tick,1000);no.addEventListener('pointerdown',e=>{e.preventDefault();no.style.position='fixed';no.style.left=Math.random()*(innerWidth-no.offsetWidth)+'px';no.style.top=Math.random()*(innerHeight-no.offsetHeight)+'px'});function yes(){btns.style.display='none';res.classList.add('show')}</script><script>
(function(){
 const music=document.getElementById('bgMusic');
 if(!music) return;
 const saved=localStorage.getItem('birthdayMusicTime');
 const wasPlaying=localStorage.getItem('birthdayMusicPlaying')==='yes';
 if(saved) music.currentTime=parseFloat(saved)||0;
 function save(){localStorage.setItem('birthdayMusicTime',music.currentTime);localStorage.setItem('birthdayMusicPlaying','yes');}
 music.addEventListener('timeupdate',save);
 music.addEventListener('play',()=>localStorage.setItem('birthdayMusicPlaying','yes'));
 document.addEventListener('pointerdown',()=>{music.play().catch(()=>{});},{once:true});
 if(wasPlaying){music.play().catch(()=>{});}
})();
</script></body></html>
