<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🎂 Cake Cutting Game ❤️</title><link rel="stylesheet" href="style.css?v=20260816d"></head><body><audio id="birthdaySong" preload="auto" loop><source src="music/happy-birthday-to-you.mp3" type="audio/mpeg"></audio><button id="musicFallback" class="music-fallback" onclick="startBirthdayMusic()">🎵 Play Birthday Song</button><div class="hearts"><span>❤️</span><span>💖</span><span>💕</span><span>💗</span><span>💞</span></div><section class="cake-game"><p class="mini-title">🎂 Birthday Mini Game</p><h1>Cake Cutting Time ❤️</h1><p class="game-instruction">Pehle candles blow karo, phir cake cut karo! ✨</p><div class="cake-area"><div class="cake-emoji" id="cakeEmoji">🎂</div><div class="candles" id="candles"><span>🕯️</span><span>🕯️</span><span>🕯️</span></div></div><button id="blowButton" onclick="blowCandles()">💨 Blow Candles</button><button id="cutButton" onclick="cutCake()" disabled>🔪 Cut The Cake</button><div id="cakeMessage" class="cake-message">Pehle candles blow karo 🎂</div><div id="cakeReward" class="cake-reward"><div>🎉🎂🎉</div><h2>Happy Birthday To You! ❤️</h2><p>Cake successfully cut! 🍰</p><div class="cake-slices">🍰 🍰 🍰</div></div><div class="page-buttons"><a href="index.html"><button>🏠 Home</button></a><a href="gallery.html"><button>📸 Memories</button></a><a href="proposal.html"><button>💌 Final Surprise</button></a></div></section><script src="script.js?v=20260816e"></script><script>function blowCandles(){document.getElementById("candles").classList.add("candles-out");document.getElementById("blowButton").disabled=true;document.getElementById("cutButton").disabled=false;document.getElementById("cakeMessage").innerHTML="✨ Candles blown! Ab cake cut karo ❤️";}function cutCake(){document.getElementById("cakeEmoji").classList.add("cake-cut");document.getElementById("cutButton").disabled=true;document.getElementById("cakeMessage").innerHTML="🔪 Slice! Slice! 🎉";document.getElementById("cakeReward").classList.add("show-reward");for(let i=0;i<25;i++)setTimeout(()=>{const h=document.createElement("div");h.className="confetti-heart";h.textContent=["❤️","💖","💕","✨","🎉"][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+"vw";document.body.appendChild(h);setTimeout(()=>h.remove(),5000)},i*60);}</script></body></html>
